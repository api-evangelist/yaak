# Vendor facets — Yaak. A fast, MIT-licensed desktop API client with one YAML file per request on
# disk, built-in Git, a CLI and an MCP server plugin. It imports Postman, Insomnia, OpenAPI and curl but
# exports only its own JSON, and its MCP plugin drives Yaak rather than serving the provider's API.
# It earns a provider's Kin Score essentially nothing.
vendor: yaak
name: Yaak
website: https://yaak.app
areas:
- api-collections
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Yaak is a client for the people calling an API, and nothing it produces is something the Kin Score reads
  on a provider. It exports a single JSON file of workspaces, not a Postman collection or an OpenAPI document,
  so postman_present and contract_present are out of reach; its CLI and MCP plugin let agents work in
  Yaak, not call the provider. The only conditional route is a public repo of Yaak request files declared
  as examples.
features:
- id: git-files
  name: Filesystem storage and built-in Git
  description: One YAML file per request, folder and environment, with branch, commit and diff from the
    app.
  source: https://yaak.app/
  tier: open-source
- id: json-export
  name: Workspace export
  description: Exports selected workspaces into a single JSON file for backup or sharing.
  source: https://yaak.app/docs/collaboration/import-and-export-data
  tier: open-source
- id: cli-mcp
  name: Agent-friendly CLI and MCP server plugin
  description: >-
    A CLI and an MCP server plugin that let Claude, Cursor and similar tools work with the user's Yaak
    data.
  source: https://yaak.app/
  tier: open-source
maps:
- feature: git-files
  check: examples_published
  layer: composite
  conditional: true
  condition: >-
    Only if the provider publishes a repo of Yaak request files that covers real calls with real payloads
    and declares it as Examples; request files are not a contract or a Postman collection.
  catalog_pass_rate: 0.052
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.127
earns_nothing:
- feature: json-export
  check: postman_present
  why: >-
    Yaak exports only its own JSON (Postman output needs third-party converters); the check reads Postman-typed
    pointers only.
- feature: cli-mcp
  check: mcp_server
  layer: agent_readiness
  why: >-
    The plugin exposes the user's Yaak workspace to an agent; it is not an MCP server for the provider's
    API.
out_of_reach:
  checks:
  - contract_present
  - documentation_present
  - console_or_sandbox
  - llms_txt_published
  - cli_present
  note: >-
    The fetched pages show no OpenAPI export, hosted docs, public console or mock, llms.txt or provider
    CLI.
surface:
  contract_quality:
    reachable: 4.0
    total: 211
  agent_readiness:
    reachable: 0
    total: 139
hard_rule: >-
  A model, not a score. Adopting this vendor changes a provider's Kin Score only when the provider publishes
  the resulting artifacts on its own surface; nothing here writes a score, and no sponsorship or partnership
  can.
method: searched
source:
